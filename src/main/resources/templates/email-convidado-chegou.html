<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #003366;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .header p {
            color: #a0a0b0;
            margin: 5px 0 0;
            font-size: 13px;
        }
        .body {
            padding: 40px 30px;
        }
        .greeting {
            font-size: 18px;
            color: #333;
            margin-bottom: 16px;
        }
        .message {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
        }
        .card {
            background-color: #f0f4ff;
            border-left: 4px solid #4a6cf7;
            border-radius: 6px;
            padding: 20px 24px;
            margin: 24px 0;
        }
        .card p {
            margin: 6px 0;
            font-size: 14px;
            color: #444;
        }
        .card p span {
            font-weight: bold;
            color: #1a1a2e;
        }
        .footer {
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Domus</h1>
        <p>Sistema de Gestão de Condomínio</p>
    </div>
    <div class="body">
        <p class="greeting">Olá, <strong th:text="${nomeMorador}">Morador</strong>!</p>
        <p class="message">
            O convidado <strong th:text="${nomeConvidado}">Convidado</strong> acabou de chegar.
        </p>
        <div class="card">
            <p><span>Data e hora da chegada:</span> <span th:text="${dataHoraChegada}">00/00/0000 00:00</span></p>
            <p><span>Morador:</span> <span th:text="${nomeMorador}">Morador</span></p>
            <p><span>Moradia:</span> <span th:text="${moradia}">Moradia</span></p>
            <p><span>Convidado:</span> <span th:text="${nomeConvidado}">Convidado</span></p>
        </div>
    </div>
    <div class="footer">
        <p>Este é um email automático, por favor não responda.</p>
        <p>© 2026 Domus — Sistema de Gestão de Condomínio</p>
    </div>
</div>
</body>
</html>
